categories:
  ai_tools:
    active_rule: interactive_required
    display_name: AI工具
    match:
      process_names:
      - chrome.exe
      - msedge.exe
      - Doubao.exe
      title_keywords:
      - ChatGPT
      - Claude
      - DeepSeek
      - Gemini
      - Kimi
      - 通义千问
      - 文心一言
      - 豆包
      - Copilot
      - Grok
      - Perplexity
      - Poe
  browser_general:
    active_rule: interactive_required
    display_name: 浏览器其他
    match:
      process_names:
      - chrome.exe
      - msedge.exe
      - iexplore.exe
      - firefox.exe
      - 360ChromeX.exe
  coding:
    active_rule: interactive_required
    display_name: 编程开发
    match:
      process_names:
      - Code.exe
      - Cursor.exe
      - clion64.exe
      - Trae CN.exe
      - codex.exe
      - WindowsTerminal.exe
      - cmd.exe
      - powershell.exe
      - MobaXterm1_CHS1.exe
      - UV4.exe
      - notepad++.exe
      - Docker Desktop.exe
      - com.docker.admin.exe
      title_keywords:
      - VS Code
      - Cursor
      - Claude Code
      - Codex
      - Visual Studio
      - GitHub
      - GitLab
      - CLion
      - Trae
  creative:
    active_rule: interactive_required
    display_name: 创作工具
    match:
      process_names:
      - JianyingPro.exe
  gaming:
    active_rule: passive_allowed
    display_name: 游戏
    match:
      process_names:
      - Steam.exe
      - WeGame.exe
  other:
    active_rule: interactive_required
    display_name: 其他
    match:
      process_names: []
      title_keywords: []
  reading:
    active_rule: interactive_required
    display_name: 阅读学习
    match:
      process_names:
      - Obsidian.exe
      - wps.exe
      - wpp.exe
      - wpspdf.exe
      - AcroRd32.exe
      - Acrobat.exe
      - chrome.exe
      - msedge.exe
      title_keywords:
      - Obsidian
      - PDF
      - 阅读
      - 文档
      - Notion
      - 飞书文档
      - 语雀
      - WPS
  social:
    active_rule: passive_allowed
    display_name: 社交通讯
    match:
      process_names:
      - weixin.exe
      - WeChat.exe
      - WeChatAppEx.exe
      - WXWork.exe
      - QQ.exe
      - QClaw.exe
      - Telegram.exe
      - WeMail.exe
  tools:
    active_rule: interactive_required
    display_name: 系统工具
    match:
      process_names:
      - ToDesk.exe
      - GameViewer.exe
      - msrdc.exe
      - 红海Pro兼容版.exe
      - Everything.exe
      - BaiduNetdisk.exe
      - localsend_app.exe
      - WizTree64.exe
      - DiskInfo64.exe
      - 7zFM.exe
      - Snipaste.exe
      - Resilio Sync.exe
      - clash-verge.exe
      - explorer.exe
      - Taskmgr.exe
      - ApplicationFrameHost.exe
      - ShellExperienceHost.exe
  video:
    active_rule: passive_allowed
    display_name: 视频娱乐
    match:
      process_names:
      - QyClient.exe
      - QyPlayer.exe
      - QQLive.exe
      - QQMusic.exe
      - PotPlayerMini64.exe
      - PotPlayer.exe
      - vlc.exe
      - chrome.exe
      - msedge.exe
      title_keywords:
      - YouTube
      - B站
      - bilibili
      - 腾讯视频
      - 爱奇艺
      - Netflix
      - 抖音
      - 西瓜视频
      - 斗鱼
      - 虎牙
      - Twitch
