# DayLens 配置文件

# ── 记录器配置 ──
tracker:
  sample_interval_seconds: 1
  flush_interval_seconds: 5
  idle_threshold_seconds: 60
  min_session_seconds: 2

# ── 基础配置 ──
sample_interval_seconds: 5
idle_threshold_seconds: 60
db_path: data/usage.db
obsidian_output_path: ''

# ── 分类规则 ──
categories:
  # ── AI 工具 ──
  ai_tools:
    display_name: AI工具
    active_rule: interactive_required
    match:
      process_names:
      - chrome.exe
      - Doubao.exe
      - msedge.exe
      title_keywords:
      - ChatGPT
      - Claude
      - DeepSeek
      - Gemini
      - Kimi
      - 通义千问
      - 文心一言
      - 豆包
      - Copilot
      - Grok
      - Perplexity
      - Poe
  # ── 编程开发 ──
  coding:
    display_name: 编程开发
    active_rule: interactive_required
    match:
      process_names:
      - clion64.exe
      - cmd.exe
      - Code.exe
      - codex.exe
      - com.docker.admin.exe
      - Cursor.exe
      - Docker Desktop.exe
      - git-bash.exe
      - git-cmd.exe
      - git-gui.exe
      - MobaXterm1_CHS1.exe
      - node.exe
      - notepad++.exe
      - powershell.exe
      - powershell_ise.exe
      - python.exe
      - pythonw.exe
      - Trae CN.exe
      - UV4.exe
      - WindowsTerminal.exe
      title_keywords:
      - VS Code
      - Cursor
      - Claude Code
      - Codex
      - Visual Studio
      - GitHub
      - GitLab
      - CLion
      - Trae
  # ── 阅读学习 ──
  reading:
    display_name: 阅读学习
    active_rule: interactive_required
    match:
      process_names:
      - Acrobat.exe
      - AcroRd32.exe
      - chrome.exe
      - ksolaunch.exe
      - ksomisc.exe
      - msedge.exe
      - Obsidian.exe
      - wordpad.exe
      - wpp.exe
      - wps.exe
      - wpspdf.exe
      title_keywords:
      - Obsidian
      - PDF
      - 阅读
      - 文档
      - Notion
      - 飞书文档
      - 语雀
      - WPS
  # ── 视频娱乐 ──
  video:
    display_name: 视频娱乐
    active_rule: passive_allowed
    match:
      process_names:
      - chrome.exe
      - msedge.exe
      - PotPlayer.exe
      - PotPlayerMini64.exe
      - QQLive.exe
      - QQMusic.exe
      - QyClient.exe
      - QyPlayer.exe
      - vlc.exe
      - wmplayer.exe
      title_keywords:
      - YouTube
      - B站
      - bilibili
      - 腾讯视频
      - 爱奇艺
      - Netflix
      - 抖音
      - 西瓜视频
      - 斗鱼
      - 虎牙
      - Twitch
  # ── 创作工具 ──
  creative:
    display_name: 创作工具
    active_rule: interactive_required
    match:
      process_names:
      - JianyingPro.exe
      title_keywords: []
  # ── 社交通讯 ──
  social:
    display_name: 社交通讯
    active_rule: passive_allowed
    match:
      process_names:
      - QClaw.exe
      - QQ.exe
      - Telegram.exe
      - WeChat.exe
      - WeChatAppEx.exe
      - weixin.exe
      - WeMail.exe
      - WXWork.exe
      title_keywords: []
  # ── 系统工具 ──
  tools:
    display_name: 系统工具
    active_rule: interactive_required
    match:
      process_names:
      - 7zFM.exe
      - amdbugreporttool.exe
      - BaiduNetdisk.exe
      - charmap.exe
      - clash-verge.exe
      - DayLens.exe
      - cleanmgr.exe
      - control.exe
      - dfrgui.exe
      - DiskInfo64.exe
      - Everything.exe
      - GameViewer.exe
      - iscsicpl.exe
      - localsend_app.exe
      - magnify.exe
      - mdsched.exe
      - mmc.exe
      - msconfig.exe
      - msinfo32.exe
      - mspaint.exe
      - msrdc.exe
      - mstsc.exe
      - narrator.exe
      - notepad.exe
      - osk.exe
      - perfmon.exe
      - psr.exe
      - quickassist.exe
      - recoverydrive.exe
      - regedit.exe
      - Resilio Sync.exe
      - Snipaste.exe
      - snippingtool.exe
      - taskmgr.exe
      - ToDesk.exe
      - wfs.exe
      - wiztree.exe
      - WizTree64.exe
      - 红海Pro兼容版.exe
      title_keywords: []
  # ── 游戏 ──
  gaming:
    display_name: 游戏
    active_rule: passive_allowed
    match:
      process_names:
      - Steam.exe
      - WeGame.exe
      title_keywords: []
  # ── 浏览器兜底 ──
  browser_general:
    display_name: 浏览器其他
    active_rule: interactive_required
    match:
      process_names:
      - 360ChromeX.exe
      - chrome.exe
      - firefox.exe
      - iexplore.exe
      - msedge.exe
      title_keywords: []
  # ── 兜底 ──
  other:
    display_name: 其他
    active_rule: interactive_required
    match:
      process_names: []
      title_keywords: []
