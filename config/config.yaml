# DayLens 配置文件

# ── 记录器配置 ──
tracker:
  sample_interval_seconds: 1
  flush_interval_seconds: 5
  idle_threshold_seconds: 60
  min_session_seconds: 2

# ── 基础配置 ──
sample_interval_seconds: 5
idle_threshold_seconds: 60
db_path: D:\OfficeSoftware\DayLens\data\usage.db
obsidian_output_path: ''

# ── 分类规则 ──
categories:
  # ── AI 工具 ──
  ai_tools:
    display_name: AI工具
    active_rule: interactive_required
    match:
      process_names:
      - chrome.exe
      - claude.exe
      - Doubao.exe
      - msedge.exe
      title_keywords:
      - ChatGPT
      - Claude
      - DeepSeek
      - Gemini
